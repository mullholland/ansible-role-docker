---
- name: Verify
  hosts: all
  gather_facts: true

  tasks:
    - name: SmokeTests
      ansible.builtin.debug:
        msg:
          - "ansible_version => {{ansible_version}}"
          - "ansible_distribution => {{ ansible_facts['distribution'] }}"
          - "ansible_distribution_major_version => {{ ansible_facts['distribution_major_version'] }}"
          - "ansible_os_family  => {{ ansible_facts['os_family'] }}"
          - "ansible_system  => {{ ansible_facts['system'] }}"

    - name: Test if Debian repository exists
      ansible.builtin.lineinfile:
        name: '/etc/apt/sources.list.d/docker.list'
        line: '# official docker repository'
        state: present
      check_mode: true
      register: docker_repository
      failed_when: (docker_repository is changed) or (docker_repository is failed)
      when: ansible_facts["os_family"] == "Debian"

    - name: Test if RedHat repository exists
      ansible.builtin.lineinfile:
        name: '/etc/yum.repos.d/docker.repo'
        line: '# official docker repository'
        state: present
      check_mode: true
      register: docker_repository
      failed_when: (docker_repository is changed) or (docker_repository is failed)
      when: ansible_facts["os_family"] == "RedHat"

    - name: Test if docker is installed
      ansible.builtin.package:
        name: "containerd.io"
        state: present
      check_mode: true
      register: docker_package
      failed_when: (docker_package is changed) or (docker_package is failed)

    - name: Test if docker is started
      ansible.builtin.service:
        name: "docker"
        state: started
      check_mode: true
      register: docker_service
      failed_when: (docker_service is changed) or (docker_service is failed)

    - name: Test if docker env file exists
      ansible.builtin.lineinfile:
        name: '/etc/docker/env'
        line: '# Collected Docker ENVIRONMENT Settings'
        state: present
      check_mode: true
      register: docker_env
      failed_when: (docker_env is changed) or (docker_env is failed)

    - name: Make sure we are not running podman
      ansible.builtin.command:
        cmd: docker --version
      register: docker_test_one
      failed_when:
        - '"podman" in docker_test_one.stdout'
